# The Lutece 8 level lutecepowers supports: the latest one published, read in the Lutece repositories by
# latest-lutece.py (cached an hour, the local Maven repository when they cannot be reached), never written down.
# Read by check-v8-floor.sh and by verify-migration.sh (PM06), site_check.py (SI01). A project whose resolved
# lutece-core is below V8_FLOOR_CORE, or is that snapshot built before V8_FLOOR_CORE_BUILD (the day the latest one was
# published), is refused by every analysis, gate and bench; a parent below V8_FLOOR_PARENT (the latest released
# lutece-global-pom 8.x) is a FAIL. An environment value pins one, to reproduce a case.
_lp_latest="$(dirname "${BASH_SOURCE[0]}")/latest-lutece.py"
if [ -z "${V8_FLOOR_CORE:-}" ] || [ -z "${V8_FLOOR_CORE_BUILD+set}" ]; then
  _lp_core=$(python3 "$_lp_latest" snapshot fr.paris.lutece:lutece-core 2>/dev/null)
  _lp_build=$(echo "$_lp_core" | cut -d: -f4)
  V8_FLOOR_CORE=${V8_FLOOR_CORE:-$(echo "$_lp_core" | cut -d: -f3)}
  V8_FLOOR_CORE_BUILD=${V8_FLOOR_CORE_BUILD-${_lp_build:+${_lp_build:0:4}-${_lp_build:4:2}-${_lp_build:6:2}}}
fi
V8_FLOOR_PARENT=${V8_FLOOR_PARENT:-$(python3 "$_lp_latest" release fr.paris.lutece.tools:lutece-global-pom 2>/dev/null | cut -d: -f3)}
# Nothing published nor in the local repository: the first Lutece 8 level, so a machine offline is not blocked.
V8_FLOOR_CORE=${V8_FLOOR_CORE:-8.0.0}
V8_FLOOR_PARENT=${V8_FLOOR_PARENT:-8.0.0}
# What a project declares: the lutece-core range lower bound and <min-core-version>, the first Lutece 8 release, so the
# range stays open and Maven resolves the latest core. The floor above is enforced on the resolved core.
V8_DECLARED_CORE=${V8_DECLARED_CORE:-8.0.0}
